# Python khoi dong cham: noi timeout probe tu 1s len 5s de khong bi restart vo co
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emailservice
spec:
  template:
    spec:
      containers:
        - name: server
          livenessProbe:
            initialDelaySeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            timeoutSeconds: 5
