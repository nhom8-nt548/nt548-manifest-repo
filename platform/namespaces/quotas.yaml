apiVersion: v1
kind: ResourceQuota
metadata: {name: staging-quota, namespace: staging}
spec:
  hard: {requests.cpu: "2", requests.memory: 2560Mi, limits.cpu: "4", limits.memory: 4Gi, pods: "30"}
---
apiVersion: v1
kind: LimitRange
metadata: {name: staging-defaults, namespace: staging}
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 50m, memory: 64Mi}
      default: {cpu: 200m, memory: 256Mi}
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: prod-quota, namespace: prod}
spec:
  hard: {requests.cpu: "2", requests.memory: 2560Mi, limits.cpu: "4", limits.memory: 4Gi, pods: "30"}
---
apiVersion: v1
kind: LimitRange
metadata: {name: prod-defaults, namespace: prod}
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 50m, memory: 64Mi}
      default: {cpu: 200m, memory: 256Mi}
